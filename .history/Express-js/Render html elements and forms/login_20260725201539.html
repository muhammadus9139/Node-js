<!DOCTYPE html>
<html>

<head>
    <title>Login Form</title>
</head>

<body>

    <h1>Login Form</h1>

    <form action="/login" method="POST">

        <label>Email:</label>
        <input type="email" name="email">

        <br><br>

        <label>Password:</label>
        <input type="password" name="password">

        <br><br>

        <button type="submit">
            Login
        </button>

    </form>

</body>

</html>
