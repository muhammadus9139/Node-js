<!DOCTYPE html>
<html lang="en">
<head>
    <title>Node Form</title>
</head>
<body>

    <h1>User Form</h1>

    <form action="/submit" method="POST">

        <input
            type="text"
            name="username"
            placeholder="Enter Name"
        >
        <br><br>

        <input
            type="email"
            name="email"
            placeholder="Enter Email"
        >
        <br><br>

        <button type="submit">
            Submit
        </button>

    </form>

</body>
</html>
